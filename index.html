<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0d">
<title>iPad 全景 VR 播放器</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:#090b0d;color:#f6f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}#stage{position:absolute;inset:0;touch-action:none}canvas{display:block;width:100%;height:100%}#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#101417}#empty strong{font-size:clamp(25px,5vw,42px);letter-spacing:0}#empty span{font-size:14px;color:#9ba5aa}header{position:absolute;z-index:3;top:0;left:0;right:0;height:calc(58px + env(safe-area-inset-top));padding:calc(8px + env(safe-area-inset-top)) 13px 8px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#080a0dcc,transparent)}header b{font-size:16px;letter-spacing:0}button{height:40px;min-width:40px;padding:0 11px;border:0;border-radius:6px;color:#fff;background:#293137}button:active{background:#465158}#menu{font-size:20px;background:#20272bcc}#panel{position:absolute;z-index:4;top:calc(62px + env(safe-area-inset-top));left:12px;width:min(520px,calc(100% - 24px));padding:14px;border:1px solid #3a444a;border-radius:8px;background:#12171bed;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}#panel>label{display:block;margin-bottom:7px;color:#bac2c7;font-size:13px}.urlrow{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:8px}input[type=url],select{height:42px;min-width:0;padding:0 10px;border:1px solid #475159;border-radius:6px;outline:0;color:#fff;background:#090c0e}input[type=url]:focus,select:focus{border-color:#eb654c}.primary{background:#df5139;font-weight:650}.options{display:flex;gap:10px;margin-top:10px}.options label{display:grid;grid-template-columns:auto 108px;align-items:center;gap:7px;color:#bfc6ca;font-size:13px}.options select{height:36px}#status{min-height:16px;margin:10px 0 0;color:#9da7ac;font-size:12px;line-height:1.35}#status.error{color:#ff927f}#controls{position:absolute;z-index:3;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));height:54px;padding:7px;display:flex;align-items:center;gap:7px;border:1px solid #3c454a;border-radius:8px;background:#11171bdb;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}#controls button{flex:0 0 40px;padding:0;font-size:17px}#seek{min-width:50px;flex:1;accent-color:#e05239}#time{color:#d3d8db;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}#video{display:none}.hidden{display:none!important}@media(max-width:600px){#time{display:none}.options{display:grid}.options label{grid-template-columns:55px 1fr}.urlrow{grid-template-columns:minmax(0,1fr) 64px}#controls{gap:4px;padding:6px}#controls button{min-width:38px;flex-basis:38px}}
</style>
</head>
<body>
<div id="app">
<div id="stage"><div id="empty"><strong>360° 网页播放器</strong><span>粘贴视频直链后开始播放</span></div></div>
<header><b>全景 VR 播放器</b><button id="menu" type="button" title="打开视频设置" aria-label="打开视频设置">☰</button></header>
<section id="panel">
<label for="url">视频直链</label>
<div class="urlrow"><input id="url" type="url" inputmode="url" placeholder="https://.../video.mp4 或 .m3u8" autocomplete="off" autocapitalize="off"><button id="load" class="primary" type="button">播放</button></div>
<div class="options"><label>投影<select id="projection"><option value="360">360°</option><option value="180">180°</option><option value="flat">普通视频</option></select></label><label>画面<select id="stereo"><option value="mono">单目</option><option value="sbs">左右 3D</option><option value="tb">上下 3D</option></select></label></div>
<p id="status">支持 MP4 和 HLS（M3U8）直链</p>
</section>
<nav id="controls" aria-label="播放控制">
<button id="play" type="button" title="播放或暂停" aria-label="播放或暂停">▶</button><input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度"><span id="time">0:00 / 0:00</span><button id="mute" type="button" title="静音" aria-label="静音">🔊</button><button id="reset" type="button" title="重置视角" aria-label="重置视角">⌖</button><button id="gyro" type="button" title="方向感应" aria-label="方向感应">◉</button><button id="fullscreen" type="button" title="全屏" aria-label="全屏">⛶</button>
</nav>
<video id="video" playsinline webkit-playsinline crossorigin="anonymous" preload="metadata"></video>
</div>
<script>
const $=s=>document.querySelector(s),video=$('#video'),stage=$('#stage'),panel=$('#panel'),statusEl=$('#status');
let scene,camera,renderer,mesh,texture,hls,dragging=false,lastX=0,lastY=0,lon=0,lat=0,gyro=false,orientation=null;
function init(){
 scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1100);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);stage.appendChild(renderer.domElement);
 texture=new THREE.VideoTexture(video);texture.colorSpace=THREE.SRGBColorSpace;build();animate();
 const preset=new URLSearchParams(location.search).get('url');if(preset)$('#url').value=preset;
}
function build(){
 if(!scene)return;if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose()}
 const p=$('#projection').value,mat=new THREE.MeshBasicMaterial({map:texture});
 if(p==='flat'){mesh=new THREE.Mesh(new THREE.PlaneGeometry(16,9),mat);mesh.position.z=-10}
 else{const phi=p==='180'?Math.PI:Math.PI*2;const geometry=new THREE.SphereGeometry(500,64,40,p==='180'?-Math.PI/2:0,phi);geometry.scale(-1,1,1);mesh=new THREE.Mesh(geometry,mat)}
 const s=$('#stereo').value;if(s==='sbs'){texture.repeat.set(.5,1);texture.offset.set(0,0)}else if(s==='tb'){texture.repeat.set(1,.5);texture.offset.set(0,.5)}else{texture.repeat.set(1,1);texture.offset.set(0,0)}texture.needsUpdate=true;scene.add(mesh);
}
function animate(){
 requestAnimationFrame(animate);
 if(gyro&&orientation){const alpha=THREE.MathUtils.degToRad(orientation.alpha||0),beta=THREE.MathUtils.degToRad(orientation.beta||0),gamma=THREE.MathUtils.degToRad(orientation.gamma||0),orient=THREE.MathUtils.degToRad(screen.orientation?.angle||window.orientation||0);const euler=new THREE.Euler(),q0=new THREE.Quaternion(),q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));euler.set(beta,alpha,-gamma,'YXZ');camera.quaternion.setFromEuler(euler);camera.quaternion.multiply(q1);camera.quaternion.multiply(q0.setFromAxisAngle(new THREE.Vector3(0,0,1),-orient))}
 else{lat=Math.max(-85,Math.min(85,lat));const phi=THREE.MathUtils.degToRad(90-lat),theta=THREE.MathUtils.degToRad(lon);camera.lookAt(500*Math.sin(phi)*Math.cos(theta),500*Math.cos(phi),500*Math.sin(phi)*Math.sin(theta))}
 renderer.render(scene,camera);
}
function message(text,error=false){statusEl.textContent=text;statusEl.className=error?'error':''}
async function loadVideo(){
 const url=$('#url').value.trim();if(!url)return message('请先输入视频 URL',true);
 message('正在连接视频…');if(hls){hls.destroy();hls=null}video.pause();video.removeAttribute('src');video.load();
 const hlsUrl=/\.m3u8(?:$|[?#])/i.test(url);
 if(hlsUrl&&video.canPlayType('application/vnd.apple.mpegurl'))video.src=url;
 else if(hlsUrl&&window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true});hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.ERROR,(_,data)=>{if(data.fatal)message('HLS 加载失败：'+data.details,true)})}
 else video.src=url;
 build();try{await video.play();$('#empty').classList.add('hidden');panel.classList.add('hidden');message('正在播放');$('#play').textContent='❚❚'}catch(error){message('无法播放。请检查直链、跨域权限和视频编码。',true)}
}
$('#load').onclick=loadVideo;$('#url').addEventListener('keydown',event=>{if(event.key==='Enter')loadVideo()});$('#menu').onclick=()=>panel.classList.toggle('hidden');
$('#play').onclick=async()=>{if(!video.currentSrc&&!hls){panel.classList.remove('hidden');return}if(video.paused){try{await video.play();$('#play').textContent='❚❚'}catch(error){message('浏览器阻止了播放',true)}}else{video.pause();$('#play').textContent='▶'}};
$('#mute').onclick=()=>{video.muted=!video.muted;$('#mute').textContent=video.muted?'🔇':'🔊'};$('#reset').onclick=()=>{lon=0;lat=0};$('#projection').onchange=build;$('#stereo').onchange=build;
$('#fullscreen').onclick=()=>{const app=$('#app');const request=app.requestFullscreen||app.webkitRequestFullscreen;if(request)request.call(app);else message('请使用 Safari 的全屏或“添加到主屏幕”',true)};
$('#gyro').onclick=async()=>{try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const result=await DeviceOrientationEvent.requestPermission();if(result!=='granted')throw new Error('denied')}gyro=!gyro;$('#gyro').style.background=gyro?'#df5139':'';message(gyro?'方向感应已开启':'方向感应已关闭')}catch(error){message('未获得设备方向权限',true)}};
addEventListener('deviceorientation',event=>orientation=event,true);
function start(x,y){dragging=true;lastX=x;lastY=y}function move(x,y){if(!dragging||gyro)return;lon+=(lastX-x)*.18;lat+=(y-lastY)*.18;lastX=x;lastY=y}
stage.addEventListener('pointerdown',event=>start(event.clientX,event.clientY));addEventListener('pointermove',event=>move(event.clientX,event.clientY));addEventListener('pointerup',()=>dragging=false);addEventListener('pointercancel',()=>dragging=false);
video.addEventListener('timeupdate',()=>{if(video.duration)$('#seek').value=video.currentTime/video.duration*1000;$('#time').textContent=format(video.currentTime)+' / '+format(video.duration)});$('#seek').oninput=event=>{if(video.duration)video.currentTime=event.target.value/1000*video.duration};
function format(value){if(!isFinite(value))return'0:00';return Math.floor(value/60)+':'+String(Math.floor(value%60)).padStart(2,'0')}
video.addEventListener('error',()=>message('视频加载失败：URL 可能失效、禁止跨域或编码不兼容。',true));addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
init();
</script>
</body>
</html>
